apiVersion: v1
kind: Namespace
metadata:
  name: paradoxy-devices
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: generic-device-plugin-config
  namespace: paradoxy-devices
data:
  config.yaml: |
    devices:
      - name: kvm
        groups:
          - count: 30
            paths:
              - path: /dev/kvm
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: paradoxy-devices
  labels:
    app.kubernetes.io/name: generic-device-plugin
    app.kubernetes.io/component: kvm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
      app.kubernetes.io/component: kvm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
        app.kubernetes.io/component: kvm
    spec:
      nodeSelector:
        paradoxy.io/kvm: "true"
      tolerations:
        - operator: Exists
      containers:
        - name: generic-device-plugin
          image: squat/generic-device-plugin:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config=/config/config.yaml
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: config
          configMap:
            name: generic-device-plugin-config
