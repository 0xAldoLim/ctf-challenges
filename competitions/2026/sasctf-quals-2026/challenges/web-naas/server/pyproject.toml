authors = ["junior@plox.com"]

[tool.poetry.dependencies]
python = "^3.14"
grpcio = "==1.80.0"
grpcio-tools = "==1.80.0"
sqlalchemy = "==2.0.50"
asyncpg = "==0.31.0"
psycopg2-binary = "==2.9.12"
pyjwt = "==2.10.1"
pydantic = "==2.13.3"
