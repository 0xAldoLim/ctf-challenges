
stream {
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:50m;

    upstream tls_backend {
        server 127.0.0.1:13317;
    }

    server {
        listen 44330;

        limit_conn per_ip_conn 1;

        proxy_pass tls_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}
