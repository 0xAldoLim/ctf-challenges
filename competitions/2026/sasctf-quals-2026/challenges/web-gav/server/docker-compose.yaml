services:
  web:
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_started
      pg-patroni:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./deploy/Dockerfile-web
    ports:
      - "8090:8090"
    environment:
      - POSTGRES_HOST=pg-patroni
      - POSTGRES_DB=ctfdb
      - POSTGRES_USER=ctfuser
      - POSTGRES_PASSWORD=ctfpassword

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    command: >
      /usr/local/bin/etcd
      --name node1
      --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://etcd:2380
      --initial-cluster node1=http://etcd:2380
      --initial-cluster-state new
      --enable-v2=true

  pg-patroni:
    depends_on:
    - etcd
    build:
      context: .
      dockerfile: ./deploy/Dockerfile-patroni
    hostname: pg-patroni
    environment:
      FLAG: SAS{placeholder}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=ctfpassword psql -h 127.0.0.1 -U ctfuser -d ctfdb -tAc 'SELECT postgis_full_version()' >/dev/null"]
      interval: 5s
      retries: 5
      start_period: 10s
