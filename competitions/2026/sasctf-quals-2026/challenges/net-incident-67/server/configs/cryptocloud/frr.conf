frr version 10.0
frr defaults traditional
hostname cryptocloud
log syslog informational
service integrated-vtysh-config
!
ip route 10.0.0.0/22 Null0
!
router bgp 64501
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 !
 neighbor 10.100.12.2 remote-as 64502
 neighbor 10.100.12.2 description globalnet
 neighbor 10.100.13.2 remote-as 64503
 neighbor 10.100.13.2 description regionallink
 !
 address-family ipv4 unicast
  network 10.0.0.0/22
  neighbor 10.100.12.2 activate
  neighbor 10.100.13.2 activate
 exit-address-family
exit
!
line vty
!
end
