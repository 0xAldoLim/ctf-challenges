frr version 10.0
frr defaults traditional
hostname usernet
log syslog informational
service integrated-vtysh-config
!
router bgp 64506
 bgp router-id 6.6.6.6
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 !
 neighbor 10.100.36.1 remote-as 64503
 neighbor 10.100.36.1 description regionallink
 neighbor 10.100.46.2 remote-as 64504
 neighbor 10.100.46.2 description ixp
 !
 address-family ipv4 unicast
  network 10.0.6.0/24
  neighbor 10.100.36.1 activate
  neighbor 10.100.46.2 activate
 exit-address-family
exit
!
line vty
!
end
