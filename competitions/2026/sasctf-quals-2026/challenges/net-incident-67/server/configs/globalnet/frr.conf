frr version 10.0
frr defaults traditional
hostname globalnet
log syslog informational
service integrated-vtysh-config
!
router bgp 64502
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 !
 neighbor 10.100.12.1 remote-as 64501
 neighbor 10.100.12.1 description cryptocloud
 neighbor 10.100.23.2 remote-as 64503
 neighbor 10.100.23.2 description regionallink
 neighbor 10.100.24.2 remote-as 64504
 neighbor 10.100.24.2 description ixp
 !
 address-family ipv4 unicast
  neighbor 10.100.12.1 activate
  neighbor 10.100.12.1 route-map RPKI-STRICT in
  neighbor 10.100.23.2 activate
  neighbor 10.100.23.2 route-map RPKI-STRICT in
  neighbor 10.100.24.2 activate
  neighbor 10.100.24.2 route-map RPKI-STRICT in
 exit-address-family
exit
!
rpki
 rpki polling_period 60
 rpki cache 10.0.7.1 3323 preference 1
exit
!
route-map RPKI-STRICT permit 10
 match rpki valid
 set local-preference 200
!
route-map RPKI-STRICT permit 20
 match rpki notfound
 set local-preference 100
!
route-map RPKI-STRICT deny 30
 match rpki invalid
!
line vty
!
end
