frr version 10.0
frr defaults traditional
hostname regionallink
log syslog informational
service integrated-vtysh-config
!
router bgp 64503
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 !
 neighbor 10.100.13.1 remote-as 64501
 neighbor 10.100.13.1 description cryptocloud
 neighbor 10.100.23.1 remote-as 64502
 neighbor 10.100.23.1 description globalnet
 neighbor 10.100.35.2 remote-as 64505
 neighbor 10.100.35.2 description player
 neighbor 10.100.36.2 remote-as 64506
 neighbor 10.100.36.2 description usernet
 !
 address-family ipv4 unicast
  neighbor 10.100.13.1 activate
  neighbor 10.100.13.1 route-map RPKI-SOFTFAIL in
  neighbor 10.100.23.1 activate
  neighbor 10.100.23.1 route-map RPKI-SOFTFAIL in
  neighbor 10.100.35.2 activate
  neighbor 10.100.35.2 route-map RPKI-SOFTFAIL in
  neighbor 10.100.36.2 activate
  neighbor 10.100.36.2 route-map RPKI-SOFTFAIL in
 exit-address-family
exit
!
rpki
 rpki polling_period 60
 rpki cache 10.0.7.1 3323 preference 1
exit
!
route-map RPKI-SOFTFAIL permit 10
 match rpki valid
 set local-preference 200
!
route-map RPKI-SOFTFAIL permit 20
 match rpki notfound
 set local-preference 100
!
route-map RPKI-SOFTFAIL permit 30
 match rpki invalid
 set local-preference 50
!
line vty
!
end
