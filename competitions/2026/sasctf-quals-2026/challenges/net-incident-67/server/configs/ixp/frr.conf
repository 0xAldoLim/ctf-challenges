frr version 10.0
frr defaults traditional
hostname ixp
log syslog informational
service integrated-vtysh-config
!
router bgp 64504
 bgp router-id 4.4.4.4
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 !
 neighbor 10.100.24.1 remote-as 64502
 neighbor 10.100.24.1 description globalnet
 neighbor 10.100.45.2 remote-as 64505
 neighbor 10.100.45.2 description player
 neighbor 10.100.46.1 remote-as 64506
 neighbor 10.100.46.1 description usernet
 !
 address-family ipv4 unicast
  neighbor 10.100.24.1 activate
  neighbor 10.100.45.2 activate
  neighbor 10.100.46.1 activate
 exit-address-family
exit
!
line vty
!
end
